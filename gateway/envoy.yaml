# Envoy: single public entry point.
#  * Browser requests arrive as gRPC-Web (binary Protobuf over HTTP/1.1 or HTTP/2).
#  * The grpc_web filter translates them to native gRPC (HTTP/2) for the services.
#  * Requests are routed by gRPC service name (/<package>.<Service>/<Method>).
#  * Anything else is the static web UI (HTML/JS files, not an API).
# __PORT__ is replaced at startup by deploy/start.sh.
static_resources:
  listeners:
    - name: public
      address:
        socket_address: { address: 0.0.0.0, port_value: __PORT__ }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                codec_type: AUTO
                stream_idle_timeout: 3600s
                route_config:
                  name: bioguard_routes
                  virtual_hosts:
                    - name: bioguard
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex: { regex: ".*" }
                          allow_methods: "POST, OPTIONS"
                          allow_headers: "content-type,x-grpc-web,x-user-agent,grpc-timeout,x-request-id"
                          expose_headers: "grpc-status,grpc-message,grpc-status-details-bin"
                          max_age: "86400"
                      routes:
                        - match: { prefix: "/bioguard.acoustic.v1.AcousticService/" }
                          route: { cluster: acoustic, timeout: 0s }
                        - match: { prefix: "/bioguard.environment.v1.EnvironmentService/" }
                          route: { cluster: environment, timeout: 0s }
                        - match: { prefix: "/bioguard.investigation.v1.InvestigationService/" }
                          route: { cluster: investigation, timeout: 0s }
                        - match: { prefix: "/bioguard.intervention.v1.InterventionService/" }
                          route: { cluster: intervention, timeout: 0s }
                        - match: { prefix: "/bioguard.prioritization.v1.PrioritizationService/" }
                          route: { cluster: prioritization, timeout: 0s }
                        - match: { prefix: "/" }
                          route: { cluster: web_ui }
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: acoustic
      type: STATIC
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: acoustic
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 50051 } } } }] }]
    - name: environment
      type: STATIC
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: environment
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 50052 } } } }] }]
    - name: investigation
      type: STATIC
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: investigation
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 50053 } } } }] }]
    - name: intervention
      type: STATIC
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: intervention
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 50054 } } } }] }]
    - name: prioritization
      type: STATIC
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: prioritization
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 50055 } } } }] }]
    - name: web_ui
      type: STATIC
      connect_timeout: 2s
      load_assignment:
        cluster_name: web_ui
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 8081 } } } }] }]
